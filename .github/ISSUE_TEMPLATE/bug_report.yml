name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, model files, KV snapshots, full prompts, tool schemas, or machine-specific paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: llama
    attributes:
      label: llama.cpp version/build
  - type: textarea
    id: logs
    attributes:
      label: Redacted log events
