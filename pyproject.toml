[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-kv-middleware"
version = "0.3.0"
description = "Persistent KV prefix caching middleware for llama.cpp and OpenAI-compatible agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "llama.cpp KV Middleware contributors" }]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "prompt-toolkit>=3.0",
  "uvicorn[standard]>=0.29",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
llama-kv-middleware = "middleware:main"

[tool.setuptools]
py-modules = ["app", "middleware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
